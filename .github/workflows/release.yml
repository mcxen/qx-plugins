name: Publish Qx Plugin Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.6.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must use semantic version form vX.Y.Z: $RELEASE_TAG"
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package plugins
        run: npm run package:plugins

      - name: Verify generated marketplace files are committed
        run: |
          if ! git diff --quiet -- index.json '*.qx-plugin'; then
            echo "Generated marketplace files are stale on $RELEASE_TAG."
            echo "Run npm run package:plugins, commit the result, and tag that commit."
            git diff --stat -- index.json '*.qx-plugin'
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp index.json release-assets/index.json
          cp ./*.qx-plugin release-assets/
          sha256sum release-assets/*.qx-plugin > release-assets/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Qx Plugins ${RELEASE_TAG#v}" \
            release-assets/*

  # 发布完成后，把 tvv.tw 加速链接写进发布说明（国内网络可直接下载）
  tvv-accelerate:
    name: 发布页追加 tvv.tw 加速链接
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 在发布说明末尾追加国内加速下载链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$(gh release list --repo "$repo" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName' || true)"
          if [ -z "$tag" ]; then echo "没有已发布的 release，跳过"; exit 0; fi
          if ! gh api "repos/$repo/releases/tags/$tag" > /dev/null 2>&1; then echo "$tag 对应的 release 不存在，跳过"; exit 0; fi
          if [ "$(gh api "repos/$repo/releases/tags/$tag" --jq .draft)" = "true" ]; then echo "$tag 还是草稿，跳过"; exit 0; fi
          assets="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].url' || true)"
          if [ -z "$assets" ]; then echo "$tag 没有资产，跳过"; exit 0; fi
          block="$RUNNER_TEMP/tvv-block.md"
          {
            echo '## 国内加速下载'
            echo
            echo '以下链接走 tvv.tw 加速，国内网络可直接下载：'
            echo
            n=0
            while IFS= read -r url; do
              if [ -z "$url" ]; then continue; fi
              name="${url##*/}"
              case "$name" in
                update-*|*.delta|*.blockmap|*.json|latest*.yml) continue ;;
              esac
              echo "- [${name}](https://tvv.tw/${url})"
              n=$((n+1))
            done <<< "$assets"
            if [ "$n" -eq 0 ]; then echo '（本次发布没有可列的安装包）'; fi
          } > "$block"
          notes="$RUNNER_TEMP/tvv-notes.md"
          gh release view "$tag" --repo "$repo" --json body --jq '.body // ""' \
            | sed '/^## 国内加速下载/,$d' > "$notes"
          cat "$block" >> "$notes"
          gh release edit "$tag" --repo "$repo" --notes-file "$notes"
          echo "已写入 $tag 的加速链接"
